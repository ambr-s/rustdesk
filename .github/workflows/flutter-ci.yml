name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    # Keep the upstream matrix for rustdesk/rustdesk, but do not run it on fork PRs.
    if: ${{ github.repository == 'rustdesk/rustdesk' }}
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
