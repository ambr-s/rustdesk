name: Full Flutter CI

# Fork policy: validation is provided by blacksmith-baseline.yml. A job-level
# condition cannot safely guard this reusable caller because GitHub validates
# its complete called-workflow graph before evaluating `if`. Preserve the
# upstream caller source, but give it no trigger in the fork.
on:
  workflow_call:

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
